# Конфигурация git-cliff: changelog собирается из истории коммитов, отдельного
# файла в репозитории нет. Единственный источник правды — сообщения коммитов,
# поэтому они обязаны оставаться conventional commits.

[changelog]
header = ""
body = """
{% if version %}
## [{{ version | trim_start_matches(pat="v") }}](https://github.com/showpiecep/newproj/releases/tag/{{ version }}) — {{ timestamp | date(format="%d.%m.%Y") }}
{% else %}
## Не выпущено
{% endif %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}\
{{ commit.message | upper_first }}\
{% endfor %}
{% endfor %}\n
"""
footer = ""
trim = true

[git]
conventional_commits = true
# Коммиты вне конвенции всё равно попадают в changelog: пропуск изменения
# страшнее неаккуратной строки.
filter_unconventional = false
filter_commits = false
protect_breaking_commits = true
split_commits = false
tag_pattern = "v[0-9]*"
topo_order = false
sort_commits = "oldest"

commit_parsers = [
  { message = "^feat", group = "<!-- 1 -->Возможности" },
  { message = "^fix", group = "<!-- 2 -->Исправления" },
  { message = "^perf", group = "<!-- 3 -->Производительность" },
  { message = "^refactor", group = "<!-- 4 -->Рефакторинг" },
  { message = "^docs", group = "<!-- 5 -->Документация" },
  { message = "^test", group = "<!-- 6 -->Проверки" },
  { message = "^(chore|ci|build)", group = "<!-- 7 -->Инфраструктура" },
  { message = "^Merge", skip = true },
  { message = ".*", group = "<!-- 8 -->Прочее" },
]
