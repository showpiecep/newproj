name: Ошибка
description: Сервис ведёт себя не так, как ожидалось
labels: [bug]
body:
  - type: textarea
    id: steps
    attributes:
      label: Как воспроизвести
      description: Запрос, конфигурация, данные. Достаточно, чтобы повторить без вопросов.
      placeholder: |
        1. POST /… с телом …
        2. …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Ожидаемое поведение
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Фактическое поведение
      description: Ответ, статус, трассировка, фрагмент лога.
      render: text
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Версия или ревизия сервиса
      description: Из ответа сервиса или `git rev-parse --short HEAD`.
    validations:
      required: true
