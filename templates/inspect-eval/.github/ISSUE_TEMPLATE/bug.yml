name: Ошибка
description: Прогон, scorer или отчёт ведут себя не так, как ожидалось
labels: [bug]
body:
  - type: textarea
    id: steps
    attributes:
      label: Как воспроизвести
      description: Команда, конфигурация, датасет. Достаточно, чтобы повторить без вопросов.
      placeholder: |
        1. make run …
        2. …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Ожидаемое поведение
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Фактическое поведение
      description: Метрики, трассировка, фрагмент лога.
      render: text
    validations:
      required: true
  - type: input
    id: log
    attributes:
      label: Лог прогона
      description: Путь к `.eval`-логу, на котором воспроизводится.
  - type: input
    id: version
    attributes:
      label: Ревизия проекта и оцениваемого сервиса
      description: "`git rev-parse --short HEAD` и версия сервиса из его ответа."
    validations:
      required: true
