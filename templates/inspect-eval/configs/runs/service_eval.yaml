# Описание прогона. Версионируется: без него результат не воспроизвести.
task_name: service_eval
dataset: data/questions.jsonl

# Профиль судьи по имени файла из configs/models/.
judge: judge
prompt_version: v1

# Критерии — контракт задачи: их имена становятся ключами оценки, а значит и
# строками таблицы метрик в шапке прогона. Число метрик задаётся этим списком и
# не растёт вместе с датасетом.
criteria:
  - name: relevance
    label: Relevance
    description: >-
      Ответ отвечает на заданный вопрос, а не на соседний, и не уходит в темы,
      о которых не спрашивали.
  - name: factual_accuracy
    label: Facts
    description: >-
      Все утверждения ответа верны и подтверждаются эталонным ответом, если он
      приведён. Выдуманные детали — невыполненный критерий.
  - name: completeness
    label: Complete
    description: >-
      Ответ покрывает то, что нужно для решения вопроса, и не обрывается на
      половине.

# Повторы делаются эпохами Inspect, а не дублями в датасете.
epochs: 1
epochs_reducer: mean

tags:
  - baseline
