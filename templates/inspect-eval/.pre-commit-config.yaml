repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        pass_filenames: true
        types_or: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        pass_filenames: true
        types_or: [python]
      - id: config-template
        name: config.template.yaml актуален
        entry: uv run python -m {{ project_slug }}.main template --check
        language: system
        pass_filenames: false
        files: ^(src/[^/]+/settings/|config\.template\.yaml$)
      - id: pytest
        name: pytest
        entry: uv run python -m pytest -q
        language: system
        pass_filenames: false
