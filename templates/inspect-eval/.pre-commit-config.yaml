repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        pass_filenames: true
        types_or: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        pass_filenames: true
        types_or: [python]
      # Пересобирает config.template.yaml и config.schema.json из моделей настроек.
      # Если файлы изменились, pre-commit остановит коммит — добавьте их и повторите.
      - id: config-artifacts
        name: config template & schema
        entry: uv run python -m {{ project_slug }}.main template
        language: system
        pass_filenames: false
        always_run: true
      - id: pytest
        name: pytest
        entry: uv run python -m pytest -q
        language: system
        pass_filenames: false
