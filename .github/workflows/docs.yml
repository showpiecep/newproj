name: Publish docs

on:
  push:
    branches:
      - main
  # После публикации релиза, а не по самому тегу: окружение github-pages
  # разрешает деплой только с main, и запуск на ref тега оно отклоняет. Здесь
  # запуск идёт в контексте main, а новый тег уже виден в истории, поэтому
  # changelog собирается с ним.
  workflow_run:
    workflows:
      - Release newproj installer
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Публикация на Pages одна на репозиторий: параллельные сборки перезаписывали бы
# друг друга. Push в main и завершение релиза приходят почти одновременно,
# поэтому очередь нужна, а отменять уже идущую публикацию нельзя.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    # Неудачный релиз не должен публиковать changelog с версией, которой нет.
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # git-cliff собирает changelog из истории и тегов: неполный клон дал
          # бы усечённый changelog вместо ошибки.
          fetch-depth: 0

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Generate changelog
        run: pipx run git-cliff --config cliff.toml --output docs/_changelog.md

      - name: Render site
        run: quarto render docs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
