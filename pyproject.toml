[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "newproj"
version = "0.3.1"
description = "Cross-platform CLI for creating projects from bundled Copier templates"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "copier>=9.4,<10",
]

[project.scripts]
newproj = "newproj.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/newproj"]

[tool.hatch.build.targets.wheel.force-include]
templates = "newproj/_templates"

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/templates",
    "/tests",
    "/README.md",
    "/pyproject.toml",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
