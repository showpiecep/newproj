[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "newproj"
version = "0.3.7"
description = "Cross-platform CLI for creating projects from bundled Copier templates"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "copier>=9.4,<10",
]

[project.scripts]
newproj = "newproj.cli:main"

[dependency-groups]
dev = [
    "pre-commit>=4.0",
    "pytest>=8.3",
    "ruff>=0.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/newproj"]

[tool.hatch.build.targets.wheel.force-include]
templates = "newproj/_templates"

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/templates",
    "/tests",
    "/README.md",
    "/pyproject.toml",
]

[tool.ruff]
target-version = "py311"
line-length = 100
# Конфигурация одна на репозиторий и передаётся ruff явно (`--config pyproject.toml`
# в хуках): иначе ruff находит pyproject.toml внутри шаблона и падает, потому что
# там Jinja вместо значений (`requires-python = ">={{ python_version }}"`).
#
# Исключены файлы шаблонов, которые как Python не разбираются: Jinja стоит на
# уровне операторов (`from {{ project_slug }} import ...`). Внутри строк и
# докстрингов Jinja парсеру не мешает, такие файлы проверяются.
extend-exclude = [
    "templates/*/pyproject.toml",
    "templates/*/tests",
    # Скрипты конфигурации импортируют пакет проекта: `from {{ project_slug }} ...`.
    "templates/*/scripts/config_*.py",
    # Jinja в выражении: `Field(default={{ service_port }})`.
    "templates/fastapi-yaml/src/*/settings/sections/app.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
